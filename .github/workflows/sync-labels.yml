name: Sync GitHub labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update labels from labels.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(
              fs.readFileSync('.github/labels.json', 'utf8')
            );
            const { owner, repo } = context.repo;

            for (const { name, color, description } of labels) {
              const colorHex = String(color).replace(/^#/, '');
              const desc = description || '';

              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name,
                  color: colorHex,
                  description: desc,
                });
                core.info(`Updated: ${name} (#${colorHex})`);
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: colorHex,
                    description: desc,
                  });
                  core.info(`Created: ${name} (#${colorHex})`);
                } else {
                  core.setFailed(`Failed on ${name}: ${error.message}`);
                  throw error;
                }
              }
            }
